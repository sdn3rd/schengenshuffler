<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Front face -->
  <polygon points="15,30 75,30 75,85 15,85" fill="url(#face)" rx="6" />
  <rect x="15" y="30" width="60" height="55" rx="7" fill="url(#face)" />
  <!-- Top face -->
  <polygon points="15,30 75,30 92,13 32,13" fill="url(#top)" />
  <!-- Right side face -->
  <polygon points="75,30 92,13 92,68 75,85" fill="url(#side)" />
  <!-- Dots on front face - showing 4 (classic die layout) -->
  <circle cx="31" cy="46" r="5.5" fill="white" opacity="0.95"/>
  <circle cx="59" cy="46" r="5.5" fill="white" opacity="0.95"/>
  <circle cx="31" cy="69" r="5.5" fill="white" opacity="0.95"/>
  <circle cx="59" cy="69" r="5.5" fill="white" opacity="0.95"/>
  <!-- Dot on top face -->
  <circle cx="52" cy="22" r="4" fill="white" opacity="0.7"/>
  <circle cx="72" cy="22" r="4" fill="white" opacity="0.7"/>
</svg>
